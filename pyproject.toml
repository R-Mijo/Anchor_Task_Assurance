[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "anchor-task-assurance"
version = "0.2.2"
description = "Evidence and verification checks before releasing AI-generated task results"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
classifiers = ["License :: Other/Proprietary License"]
authors = [{name = "Marco Armijo (R-Mijo)"}]
dependencies = []
[project.scripts]
anchor = "anchor_task_assurance.cli:main"
[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]
[tool.setuptools.packages.find]
include = ["anchor_task_assurance*"]
[tool.setuptools.package-data]
anchor_task_assurance = ["data/*.jsonl", "data/*.txt"]
