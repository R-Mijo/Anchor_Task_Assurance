[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "anchor-task-assurance"
version = "0.2.1"
description = "Evidence and verification checks before releasing AI-generated task results"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
classifiers = ["License :: Other/Proprietary License"]
authors = [{name = "Marco Armijo (R-Mijo)"}]
dependencies = []
[project.scripts]
anchor = "agp.cli:main"
[tool.setuptools.packages.find]
include = ["agp*"]
[tool.setuptools.package-data]
agp = ["data/*.jsonl", "data/*.txt"]
